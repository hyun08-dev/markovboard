# GitHub Pages 배포
#
# 백엔드가 없는 정적 사이트라 빌드 결과(dist/)를 그대로 올리면 된다.
# 브랜치 이름을 하드코딩하지 않고 **기본 브랜치에 푸시됐을 때만** 배포한다.
# 나중에 main 으로 옮겨도 이 파일을 고칠 필요가 없다.
#
# Pages 활성화는 configure-pages 단계가 자동으로 시도한다. 저장소 권한이나 요금제
# 때문에 실패하면 그 단계만 경고로 넘어가고, 그때는 손으로 한 번 켜 주면 된다:
#   Settings → Pages → Build and deployment → Source: "GitHub Actions"

name: Deploy to GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 하나씩. 진행 중인 배포를 중간에 끊지 않는다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pages 를 켜고 빌드 방식을 'workflow' 로 맞춘다. 이게 안 되어 있으면 마지막
      # deploy-pages 단계가 Pages API 에서 거절당한다.
      #
      # continue-on-error 를 둔 이유: 자동 활성화는 **편의**이지 요구사항이 아니다.
      # 조직 정책이나 요금제(비공개 저장소의 Pages) 때문에 권한이 없을 수 있는데,
      # 그때 빌드까지 멈춰 세우면 손으로 켜는 기존 경로보다 오히려 나빠진다.
      # 실패하면 경고만 남기고 계속 가서, deploy 단계가 설정 링크가 담긴 원래
      # 오류 메시지를 보여주게 둔다.
      - name: Pages 활성화
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # 계산이 틀린 채로 배포되지 않게 막는다.
      - name: 타입 검사
        run: npm run typecheck

      - name: 단위 테스트
        run: npm test

      - name: 빌드
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
